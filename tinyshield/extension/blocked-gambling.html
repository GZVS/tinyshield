<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Site blocked — TinyShield</title>
    <link rel="stylesheet" href="ui.css" />

  <body class="blocked" data-category="gambling">
    <main>
      <img class="large-shield" src="assets/shield.svg" alt="" />
      <h1>This site is blocked</h1>
      <p class="reason">Gambling</p>
      <p class="explanation" id="blocked-note">
        TinyShield blocked this site based on your settings.
      </p>
      <div class="actions">
        <a
          id="github-link"
          class="button"
          href="https://github.com/GZVS"
          rel="noreferrer noopener"
          referrerpolicy="no-referrer"
          >Visit GZVS on GitHub</a
        ><button class="button secondary" type="button" id="go-back">
          Go back
        </button>
      </div>
      <p class="block-brand">TinyShield · Protection, kept simple</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
