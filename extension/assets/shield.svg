<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="zgBg" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="zgGold" x1="24" y1="12" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="zgBorder" x1="12" y1="4" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="zgGlow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M24 4 L40 9.5 V23 C40 32.5 33 39.5 24 43.5 C15 39.5 8 32.5 8 23 V9.5 Z" 
        fill="url(#zgBg)" 
        stroke="url(#zgBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
        
  <!-- Subtle Inner Shield Facet -->
  <path d="M24 7 L37 11.5 V23 C37 30.5 31.5 36.8 24 40.2 V7 Z" 
        fill="#FFFFFF" 
        fill-opacity="0.08"/>

  <!-- Zenith Peak Apex Symbol (Gold Crown / Chevron) -->
  <g filter="url(#zgGlow)">
    <!-- Primary Upper Peak -->
    <path d="M24 13 L31 24 L24 21.5 L17 24 Z" fill="url(#zgGold)"/>
    <!-- Lower Supporting Apex -->
    <path d="M24 23 L29 32 L24 30 L19 32 Z" fill="url(#zgGold)" fill-opacity="0.9"/>
  </g>
</svg>